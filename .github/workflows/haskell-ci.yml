name: Haskell CI

# ---------------------------------------------------------------------------
#  Continuous integration for the `mcp-server-haskell/` package — the
#  Haskell rewrite of the MCP server. Modelled on conventions used by
#  haskell/cabal, jgm/pandoc, and well-typed/generics-sop: matrix across
#  supported GHC/OS pairs, cabal-store cache keyed on the freeze file,
#  haddock/cabal-check/sdist gates, and separate hlint + fourmolu linters.
#
#  A single ``required`` job at the bottom folds every gate's result into
#  one status check that branch protection can enforce — see GitHub
#  Settings → Branches → "Require status checks" and point at it.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [master]
    paths:
      - "mcp-server-haskell/**"
      - ".github/workflows/haskell-ci.yml"
    tags: ["v*.*.*"]      # triggers the release job
  pull_request:
    branches: [master]
    paths:
      - "mcp-server-haskell/**"
      - ".github/workflows/haskell-ci.yml"
  workflow_dispatch: {}

# Concurrency policy: PR runs are cancelled when a new push lands
# on the same PR head, master runs are NEVER cancelled so every
# commit on the protected branch gets its own green/red signal.
#
# Why this exact shape — past attempts at
# `cancel-in-progress: ${{ <conditional> }}` got cancelled
# anyway (~50% of master runs over the last 50). GitHub Actions
# stringifies the expression result, and "false" as a string is
# truthy in some evaluation paths, so the conditional silently
# became `cancel-in-progress: true` for master.
#
# The bulletproof pattern: make each master commit's group key
# unique (per-SHA), so it never SHARES a lock with another
# in-flight run. With nothing to cancel, the cancel-in-progress
# value doesn't matter — no expression-stringification footgun.
#
# PR runs still share a per-ref group so a new push on the same
# PR head DOES cancel the previous build (the desired behaviour
# for iterative PR feedback).
concurrency:
  group: haskell-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# Least-privilege by default. Individual jobs ask for extras explicitly.
permissions:
  contents: read

defaults:
  run:
    working-directory: mcp-server-haskell

jobs:
  # -------------------------------------------------------------------------
  #  Tier-2 sharded ubuntu matrix: symmetric 3 × 2 = 6 cells, all blocking.
  #
  #  Layout:
  #    * 2 GHC versions × 3 shards (1/3, 2/3, 3/3) = 6 cells
  #
  #  Symmetric on the gating-OS side: every shard divisor matches
  #  on both GHC versions so the per-cell partition is identical
  #  regardless of which compiler is running it. The macOS job
  #  below uses the asymmetric variant (different divisors per
  #  GHC) for variety and to fit its smaller cell budget.
  #
  #  Measured: full e2e sequentially = 467 s (CI baseline). Local
  #  shard 1/3 with N=8 = 166 s for 24 scenarios. Projected CI
  #  wall-clock per shard cell ≈ 250-300 s.
  #
  #  Why ubuntu-only here (macOS is a separate advisory job below):
  #  the aggregator 'needs: [build-and-test, hlint]' waits for
  #  EVERY cell of the matrix to complete before running. Keeping
  #  macOS in this matrix would make the aggregator wait for the
  #  ~13 min macOS cell even though it's continue-on-error and
  #  doesn't gate. Splitting macOS into its own job removes that
  #  wait without changing what blocks vs. what's advisory.
  # -------------------------------------------------------------------------
  build-and-test:
    name: Build & test — ubuntu / GHC ${{ matrix.ghc }} / shard ${{ matrix.shard }}
    # Gate every shard cell on hlint. Hlint runs in ~30 s; the
    # build-and-test cell costs ~3-13 min × 6 cells = up to ~80 min
    # of CI compute. A PR that fails hlint used to burn that whole
    # budget before surfacing the style break — now it stops at
    # 30 s.
    needs: [hlint, invariants]
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.10.1", "9.12.2"]
        cabal: ["3.12.1.0"]
        shard: ["1/3", "2/3", "3/3"]
    runs-on: ubuntu-latest

    # Pre-baked CI image (.docker/Dockerfile.ci, published by
    # build-ci-image.yml to GHCR). The image already contains:
    #   * GHC + cabal at the matrix versions  (replaces Set-up-GHC)
    #   * hlint binary on PATH                (replaces Install HLint)
    #   * ~/.cabal/store/ pre-populated with the freeze closure
    #                                          (replaces Restore cabal-store)
    #   * the Baseline e2e fixture pre-built  (replaces Pre-warm step)
    #
    # Net: matrix-cell cold-start drops from ~3 min of toolchain
    # provisioning to ~10 s of image pull. macOS cells (separate job
    # below) can't use `container:` and still go through ghcup.
    container:
      image: ghcr.io/${{ github.repository_owner }}/haskell-flows-ci:${{ matrix.ghc }}-latest

    # GitHub Actions sets HOME=/github/home for `container:` jobs so
    # the runner has a writable home, but the image's cabal config
    # + ~/.cabal/store/ + Hackage index were populated under /root.
    # Without these env vars cabal looks at /github/home (empty) and
    # fails Configure with "The package list for 'hackage.haskell.org'
    # does not exist." Pointing CABAL_DIR + XDG_CONFIG_HOME at /root
    # makes cabal see the image's pre-baked state.
    env:
      CABAL_DIR: /root/.cabal
      XDG_CONFIG_HOME: /root/.config
      # Ubuntu Docker containers ship with POSIX locale by default;
      # test output contains Unicode arrows / dashes that crash
      # `commitBuffer` without a UTF-8 locale.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - uses: actions/checkout@v6

      # Re-run cabal configure + freeze inside the container so the
      # plan reflects the current Hackage index + source tree, not
      # the snapshot baked into the image. Cheap (~5 s) and lets the
      # next `cabal build` reuse whatever subset of the image's
      # ~/.cabal/store is still version-compatible.
      - name: Configure + freeze
        run: |
          cabal configure --enable-tests --enable-benchmarks --disable-documentation
          cabal freeze

      # Single `cabal build all` builds deps + project in one pass.
      # On warm-image runs this is mostly a no-op for deps (already
      # in the store) and ~30 s for the project itself. `--keep-going`
      # surfaces multiple errors per cell instead of stopping at the
      # first — saves rerun cycles when a refactor breaks several
      # downstream modules at once.
      - name: Build (deps + project)
        run: cabal build all --keep-going

      # Stability over micro-speedup: sharding is the load-bearing
      # parallelism. Each shard runs ~1/3 of the 70 scenarios on its
      # own runner with its own clean ~/.cabal/store, so three shards
      # cover the full suite in roughly max(shard_wallclock).
      #
      # HASKELL_FLOWS_E2E_PARALLEL=1 — within-shard parallelism is
      # OFF. The project's own measurements show parallel within a
      # shard only buys ~10% (full e2e N=8 vs sequential: 419s vs
      # 467s) because the bottleneck is filesystem contention on
      # ~/.cabal/store, not CPU. The 10% gain wasn't worth the
      # FlowArbitrary / FlowProject startup-race surface area that
      # consistently bit ubuntu shards (see commit fixing the race
      # for the diagnosis trail). Sharding still gives ~3x wall-clock
      # speedup, which is the part that actually matters.
      #
      # Local measurement (8-core macOS):
      #   full e2e (sequential, baseline) : 467 s
      #   full e2e (N=8, no shard)        : 419 s   (-10%)
      #   shard 1/3 (24 scenarios, N=1)   : ~155 s  (~33% of full)
      #
      # Projected CI per-cell (4-vCPU ubuntu, shard cell):
      #   GHC install (cached)            :  ~10 s
      #   Build project (cached)          :  ~30 s
      #   Run tests                       : ~250 s
      #     - unit (514)                  :  ~17 s
      #     - e2e (~23 of 70)             : ~230 s
      #   Haddock + cabal check + sdist   :  ~65 s
      #   Cell total (warm cache)         : ~360 s  (= 6.0 min)
      # NOTE: tests must NOT use --keep-going. cabal returns exit 0 with
      # --keep-going even when a test-suite exits non-zero, which masks
      # real failures (a green check while tests are red). We run each
      # suite explicitly, track per-suite exit codes, and fail if either
      # failed — so both suites always run AND neither can swallow the
      # other's red. Build (above) keeps --keep-going on purpose; only
      # the test exit code must stay honest. Guarded by
      # scripts/check-ci-invariants.sh. The bespoke unit harness already
      # runs every test and reports all failures, so dropping
      # --keep-going loses no within-suite coverage.
      - name: Run tests (unit + e2e)
        env:
          HASKELL_FLOWS_E2E_PARALLEL: "1"
          HASKELL_FLOWS_E2E_SHARD: ${{ matrix.shard }}
        run: |
          rc=0
          cabal test haskell-flows-mcp-test --test-show-details=direct --test-options="--color" || rc=1
          cabal test haskell-flows-mcp-e2e  --test-show-details=direct --test-options="--color" || rc=1
          exit $rc

      # haddock + cabal check + sdist round-trip moved to a separate
      # `package-quality` job (run once, not 6x per matrix cell). See
      # the bottom of this file. Saves ~30-60 s × 6 cells per push.

  # -------------------------------------------------------------------------
  #  macOS portability canary — advisory, sharded.
  #
  #  Cell-count is asymmetric across GHC versions to fit GitHub's
  #  free-tier macOS concurrent-runner cap (5 simultaneous macOS
  #  runners per org). With 6 cells, one was always queued — the
  #  queue compounded across in-flight commits and surfaced as
  #  pseudo-cancellations in the matrix UI. Five cells hits the
  #  ceiling exactly without spilling for a single in-flight run.
  #
  #  Layout (3+2 = 5 cells):
  #    * GHC 9.10.1 → 2 shards (1/2, 2/2)        = 2 cells
  #    * GHC 9.12.2 → 3 shards (1/3, 2/3, 3/3)   = 3 cells
  #    * Total                                    = 5 cells
  #
  #  Coverage rationale: every scenario runs on macOS twice
  #  (once via the 9.10.1 2-way split, once via the 9.12.2 3-way
  #  split) — strictly more redundancy per scenario than a flat
  #  3×2-design where each scenario ran exactly once per GHC
  #  version.
  #
  #    * 'continue-on-error: true' — failure / cancellation never blocks.
  #    * Deliberately NOT in 'required.needs' — the aggregator does not
  #      WAIT for this job, so the green-check signal arrives via the
  #      ubuntu shards alone.
  #
  #  When multiple master commits land back-to-back and saturate
  #  the org-wide cap (4 in-flight × 5 cells = 20 macOS jobs vs
  #  quota=5), the queue drains naturally — the workflow does NOT
  #  use cancel-in-progress at the job level so older commits keep
  #  their macOS jobs alive. Trade is wall-clock to drain (~26 min
  #  for 9 jobs at 5-concurrent); the green-streak counter waits
  #  for that drain but the aggregator (ubuntu + hlint) doesn't.
  # -------------------------------------------------------------------------
  build-and-test-macos:
    name: Build & test — macOS / GHC ${{ matrix.ghc }} / shard ${{ matrix.shard }} (advisory)
    # Same gate as the ubuntu matrix: hlint must be green for any
    # macOS cell to consume a runner. macOS minutes count 10x on
    # GitHub free-tier billing; this is even more important here.
    needs: [hlint, invariants]
    # Skip macOS on PR runs — feedback for PRs comes via the ubuntu
    # matrix (gating + faster). macOS is the portability canary; it
    # runs on master pushes (post-merge validation) and on nightly /
    # manual dispatches (regression watch). PR feedback time stops
    # waiting for ~10-min macOS shards.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        # Asymmetric 2+3 = 5 cells across both GHC versions:
        #   * 9.12.2 → 2 shards (1/2, 2/2)        = 2 cells
        #   * 9.10.1 → 3 shards (1/3, 2/3, 3/3)   = 3 cells
        #
        # Each scenario runs on macOS at least once per GHC version.
        # 5 cells fits the macOS free-tier 5-concurrent-runner cap
        # exactly without spilling for a single in-flight run; queueing
        # only kicks in when multiple master commits land back-to-back.
        #
        # macOS is advisory (continue-on-error: true) so a red cell
        # never blocks the ubuntu-gated aggregator.
        include:
          - { ghc: "9.12.2", cabal: "3.12.1.0", shard: "1/2" }
          - { ghc: "9.12.2", cabal: "3.12.1.0", shard: "2/2" }
          - { ghc: "9.10.1", cabal: "3.12.1.0", shard: "1/3" }
          - { ghc: "9.10.1", cabal: "3.12.1.0", shard: "2/3" }
          - { ghc: "9.10.1", cabal: "3.12.1.0", shard: "3/3" }
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      # macOS has NO built-in GHC toolcache, so without this cache
      # `haskell-actions/setup@v2` downloads + installs GHC from
      # scratch on every run (~3m45s observed on a typical run).
      # Caching ~/.ghcup drops that to ~10 s on cache hit — saves
      # ~3.5 min × 5 macOS cells = ~17.5 min of macOS compute per push.
      - name: Cache ghcup (GHC + cabal binaries)
        uses: actions/cache@v6
        with:
          path: ~/.ghcup
          key: ${{ runner.os }}-ghcup-${{ matrix.ghc }}-${{ matrix.cabal }}

      - id: setup
        name: Set up GHC ${{ matrix.ghc }} / cabal ${{ matrix.cabal }}
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}
          cabal-update: true

      - name: Configure + freeze
        run: |
          cabal configure --enable-tests --enable-benchmarks --disable-documentation
          cabal freeze

      - name: Restore cabal store cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-${{ matrix.cabal }}-${{ hashFiles('mcp-server-haskell/cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-cabal-${{ matrix.cabal }}-

      # See ubuntu job for rationale on the combined build step.
      - name: Build (deps + project)
        run: cabal build all --keep-going

      # 'haskell-actions/hlint-setup@v2' ships only x86_64 prebuilt
      # binaries — it fails on macos-latest (now arm64) with
      # "Unsupported architecture hlint: arm64". Homebrew has a
      # native aarch64 bottle; the standalone 'hlint' job on
      # ubuntu remains the authoritative version gate, so brew's
      # version on macOS is only consumed by the e2e
      # 'findExecutable "hlint"' probe and minor drift is fine.
      - name: Install HLint (Homebrew)
        shell: bash
        run: |
          brew install hlint
          hlint --version

      # See ubuntu job above for rationale. Same closure, same
      # cache invalidation key — populates ~/.cabal/store/ with
      # QuickCheck + transitive before the e2e pool starts.
      - name: Pre-warm E2E fixture deps
        working-directory: mcp-server-haskell/test-e2e/Fixtures/Baseline
        run: cabal build

      # Shard string is per-cell from the matrix include block —
      # 1/2 and 2/2 on GHC 9.10.1, 1/3..3/3 on GHC 9.12.2. The
      # E2E.Sharding harness honours arbitrary "i/n" so both
      # split widths work without harness changes. Each cell's
      # union with its same-GHC siblings covers the full 70-scenario
      # suite once per GHC version.
      # NO --keep-going on tests — see the ubuntu cell above for the
      # exit-code-masking rationale. Same explicit per-suite run so a
      # red suite can't report green. Guarded by check-ci-invariants.sh.
      - name: Run tests (unit + e2e)
        env:
          # Within-shard parallelism OFF — see the ubuntu cell above
          # for the rationale + numbers. macOS gets the same treatment
          # for consistency; the cabal-store contention isn't strictly
          # symmetric with Linux but the policy is identical so the
          # two OSes can be compared 1:1 when triaging future flakes.
          HASKELL_FLOWS_E2E_PARALLEL: "1"
          HASKELL_FLOWS_E2E_SHARD: ${{ matrix.shard }}
        run: |
          rc=0
          cabal test haskell-flows-mcp-test --test-show-details=direct --test-options="--color" || rc=1
          cabal test haskell-flows-mcp-e2e  --test-show-details=direct --test-options="--color" || rc=1
          exit $rc

      # haddock / cabal check / sdist moved to the `package-quality`
      # job. macOS doesn't need a redundant copy; ubuntu's run is the
      # canonical one.

  # -------------------------------------------------------------------------
  #  Package-quality gates — haddock, cabal check, sdist round-trip.
  #  These are OS+GHC-independent: running once on a canonical cell
  #  catches the same issues as running 11x across the matrix did,
  #  for ~1/11 the cost. Gated by hlint like build-and-test.
  # -------------------------------------------------------------------------
  package-quality:
    name: Package quality (haddock + check + sdist)
    needs: [hlint, invariants]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache ghcup (GHC + cabal binaries)
        uses: actions/cache@v6
        with:
          path: ~/.ghcup
          key: ${{ runner.os }}-ghcup-9.12.2-3.12.1.0

      - id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12.2"
          cabal-version: "3.12.1.0"
          cabal-update: true

      - name: Configure + freeze
        run: |
          cabal configure --enable-tests --enable-benchmarks --disable-documentation
          cabal freeze

      - name: Restore cabal store cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.12.2-cabal-3.12.1.0-${{ hashFiles('mcp-server-haskell/cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.12.2-cabal-3.12.1.0-

      # Haddock with `--haddock-all` spots broken @<https://...>@ links,
      # dangling @-refs, and modules missing from the package description.
      - name: Build haddocks
        run: cabal haddock all --haddock-all

      - name: Cabal check (package metadata sanity)
        run: cabal check

      # Proves the package can be published to Hackage. Round-tripping the
      # tarball catches missing extra-source-files and bad file globs.
      - name: SDist round-trip
        run: |
          cabal sdist all --output-dir /tmp/haskell-flows-mcp-sdist
          ls -la /tmp/haskell-flows-mcp-sdist

  # -------------------------------------------------------------------------
  #  Coverage ratchet — runs the unit suite under HPC and fails if coverage
  #  drops below the committed floor (mcp-server-haskell/coverage-baseline.txt).
  #  Single cell, gated by hlint like package-quality. The ratchet only ever
  #  moves UP (the gate prints a hint to raise the floor when coverage
  #  improves). See scripts/coverage-gate.sh.
  # -------------------------------------------------------------------------
  coverage:
    name: Coverage ratchet
    needs: [hlint, invariants]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Cache ghcup (GHC + cabal binaries)
        uses: actions/cache@v6
        with:
          path: ~/.ghcup
          key: ${{ runner.os }}-ghcup-9.12.2-3.12.1.0

      - id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.12.2"
          cabal-version: "3.12.1.0"
          cabal-update: true

      - name: Configure + freeze
        run: |
          cabal configure --enable-tests --disable-documentation
          cabal freeze

      # Coverage uses a separate -fhpc build, so it gets its own cache
      # key suffix (-cov) to avoid thrashing the non-coverage caches the
      # build-and-test / package-quality jobs populate.
      - name: Restore cabal store cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.12.2-cabal-3.12.1.0-cov-${{ hashFiles('mcp-server-haskell/cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-ghc-9.12.2-cabal-3.12.1.0-cov-

      # Script resolves the repo root from its own location and cd's into
      # mcp-server-haskell; run it from the repo root (override the
      # mcp-server-haskell default working-directory).
      - name: Coverage ratchet gate
        working-directory: .
        run: bash scripts/coverage-gate.sh

      # Keep the HTML report whatever the outcome — on a red ratchet it's
      # exactly what you want to inspect to see which module regressed.
      - name: Upload HPC HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: mcp-server-haskell/dist-newstyle/build/**/t/haskell-flows-mcp-test/hpc/vanilla/html
          retention-days: 14
          if-no-files-found: warn

  # -------------------------------------------------------------------------
  #  HLint with inline PR annotations. Fails on any 'suggestion' severity or
  #  above — matches the zero-tolerance stance locked in during Phase 2-3.
  # -------------------------------------------------------------------------
  hlint:
    name: HLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up HLint
        uses: haskell-actions/hlint-setup@v2
        # 'latest' tracks the bundled hlint used by the local ghc_lint
        # tool (currently 3.10). Pinning an older version here drifted
        # from the local zero-suggestions baseline because newer hlint
        # releases relax hints that older ones still emit.
        with:
          version: "latest"

      - name: Run HLint
        uses: haskell-actions/hlint-run@v2
        # Single-path form. Earlier I tried the JSON-array form via YAML
        # folded scalar (`>-`) which the action's parser rejected with
        # `SyntaxError: Unexpected end of JSON input`; letting hlint
        # recurse through the package root is simpler and covers
        # src/, test/, and app/ in one pass.
        with:
          path: mcp-server-haskell/
          # 'warning' (not 'suggestion') is the pragmatic threshold: we
          # already block on hints locally via ghc_lint, and CI HLint
          # version drift can surface stylistic suggestions that don't
          # warrant a merge block. Warnings and errors remain blocking.
          fail-on: warning

  # -------------------------------------------------------------------------
  #  Fast meta-invariants gate — pure bash greps over the checked-out tree,
  #  no GHC/cabal build. Consolidates the three drift guards (rules-freshness
  #  was previously local-only in ci-local.sh; now it gates master too).
  #  Gates the matrix like hlint so meta-drift fails in seconds, not after a
  #  full build. Each script is also runnable standalone and from ci-local.
  # -------------------------------------------------------------------------
  invariants:
    name: Invariants (rules + CI + scenarios)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v6
      - name: Rules-freshness (no stale tool counts / retired names)
        run: bash scripts/check-rules-freshness.sh
      - name: CI-invariants (no --keep-going on test steps)
        run: bash scripts/check-ci-invariants.sh
      - name: Scenario registration (every Flow*.hs is wired up)
        run: bash scripts/check-scenario-registration.sh

  # -------------------------------------------------------------------------
  #  Fourmolu job intentionally omitted.
  #
  #  Rationale: the codebase uses the leading-comma / grouped-import style
  #  from Phase 1, which doesn't match any of fourmolu 0.16.x's built-in
  #  `import-export-style` presets exactly. Enabling the check would
  #  require a whole-tree rewrite that touches every module for no
  #  semantic benefit. Local hlint (ghc_lint) already enforces style
  #  hygiene; re-adding fourmolu is a future decision once we're willing
  #  to commit one big reformat PR.
  # -------------------------------------------------------------------------

  # -------------------------------------------------------------------------
  #  Advisory scan for stale dependency bounds. Runs on every push but is
  #  allowed to fail without blocking the merge — the goal is to surface
  #  drift, not to chase every Hackage bump on the critical path.
  #
  #  Why step-level `continue-on-error` instead of job-level:
  #
  #  A job with `continue-on-error: true` does not block the pipeline,
  #  but it still renders as a red ❌ in the Actions UI when any step
  #  fails — which is visually indistinguishable from a real regression.
  #  `haskell-actions/setup@v2`'s ghcup install is a known flake source
  #  (CDN hiccups surface as `Error: <No error message>` with no
  #  actionable content), and a red badge on a non-actionable advisory
  #  job trains everyone to ignore CI signal. Worse than useless.
  #
  #  Moving `continue-on-error` to each step keeps the outer job green
  #  while surfacing per-step failures as ⚠️ warnings with annotations.
  #  The drift signal we actually want from `cabal outdated` is still
  #  visible (just not blocking), the toolchain flake is surfaced as a
  #  warning, and the job badge is honest: green means "we ran it,
  #  here's what we saw" rather than "definitely broken".
  # -------------------------------------------------------------------------
  outdated:
    name: Outdated dependencies (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        id: setup
        continue-on-error: true
        with:
          ghc-version: "9.12.2"
          cabal-version: "3.12.1.0"
          cabal-update: true

      - name: Report outdated bounds
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        run: cabal outdated --exit-code

      - name: Note setup flake
        if: steps.setup.outcome == 'failure'
        run: |
          echo "::warning title=Toolchain install flaked::haskell-actions/setup@v2 failed with no actionable message — typical ghcup CDN flake. The advisory scan was skipped for this run; re-run the workflow if you want a fresh drift report."

  # -------------------------------------------------------------------------
  #  Latency-budget bench (#96 Phase C).
  #
  #  Runs the in-process measurement harness from `benchmarks/Main.hs`
  #  with the gate enabled (`HFLOWS_BENCH_GATE=1`); the binary exits
  #  non-zero when any tool's measured p95 exceeds its
  #  `Bench/Budget.hs` budget. Per-step `continue-on-error: true` so
  #  the job badge stays advisory while the gate is bedding in — once
  #  Phase D's nightly run produces a measured-budget table from the
  #  reference project, this step can be promoted to required.
  #
  #  Why ubuntu-only:
  #
  #    * The budgets in `Bench/Budget.hs` are *initial-proposal*
  #      values (issue #96 §1) tuned against the dogfood pass, which
  #      ran on macOS arm64. Linux runners are typically a touch
  #      faster on the cheap tools and a touch slower on cabal-heavy
  #      tools; the variance is well inside the (p95 - p50) headroom
  #      so a single-OS gate is informative without false positives.
  #    * Adding macOS to the matrix doubles CI minute spend for a
  #      signal that hasn't yet earned a hard gate.
  # -------------------------------------------------------------------------
  bench:
    name: Bench (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        id: setup
        continue-on-error: true
        with:
          ghc-version: "9.12.2"
          cabal-version: "3.12.1.0"
          cabal-update: true

      - name: Run bench gate
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        env:
          # Phase C: opt-in gate. Bench Main.hs reads this env var
          # (or the --gate flag) and exits non-zero on sustained
          # p95 breach.
          HFLOWS_BENCH_GATE: "1"
        run: |
          # Match the local script's invocation so a developer can
          # reproduce the result with `scripts/bench-mcp.sh --gate`.
          cabal run haskell-flows-mcp-bench --offline -- --gate

      - name: Note setup flake
        if: steps.setup.outcome == 'failure'
        run: |
          echo "::warning title=Toolchain install flaked::haskell-actions/setup@v2 failed during the bench job — typical ghcup CDN flake. The bench gate was skipped for this run; re-run the workflow if you want a fresh latency report."

  # -------------------------------------------------------------------------
  #  Single aggregation job. Branch protection should require *only* this
  #  check — the matrix jobs change shape as we add GHC versions, and this
  #  keeps the branch-protection config stable.
  # -------------------------------------------------------------------------
  required:
    name: Haskell CI required
    runs-on: ubuntu-latest
    # Run on every trigger EXCEPT tag pushes (those go to the release
    # job). The original form was `always() && X || Y` which relies on
    # GitHub Actions precedence `(always() && X) || Y`; equivalent but
    # hard to scan. The simplified form below is the same truth table
    # across the four trigger shapes (push to master / PR / dispatch /
    # tag push).
    if: always() && !startsWith(github.ref, 'refs/tags/')
    needs: [build-and-test, hlint, package-quality, coverage, invariants]
    permissions:
      contents: read
      # statuses:write so the final step below can post a commit
      # status derived from the aggregated check-run results. See
      # the "Publish commit status" step for the rationale.
      statuses: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Assert every required dependency succeeded
        id: assert
        run: |
          if [[ "${{ needs.build-and-test.result }}"   != "success" ]] \
          || [[ "${{ needs.hlint.result }}"            != "success" ]] \
          || [[ "${{ needs.package-quality.result }}"  != "success" ]] \
          || [[ "${{ needs.coverage.result }}"         != "success" ]] \
          || [[ "${{ needs.invariants.result }}"       != "success" ]]; then
            echo "One or more required Haskell CI jobs failed."
            echo "agg_state=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "All required Haskell checks green."
          echo "agg_state=success" >> "$GITHUB_OUTPUT"

      # GitHub's repo favicon reflects the *legacy* Commit Status API
      # (posted via `POST /repos/:o/:r/statuses/:sha`), not the newer
      # check-runs API that Actions publishes through. With zero legacy
      # statuses on a commit, the combined status is 'pending' and the
      # favicon gets a red X overlay even when every check-run passed.
      #
      # This step posts a single legitimate commit status derived from
      # the aggregated result above (build-and-test + hlint), so the
      # combined status reflects the real CI outcome. `if: always()`
      # so a failing CI still posts a `failure` status — we want the
      # favicon to be honest about red runs too, not only green ones.
      - name: Publish combined commit status
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const state = '${{ steps.assert.outputs.agg_state }}' || 'failure';
            const build = '${{ needs.build-and-test.result }}';
            const lint  = '${{ needs.hlint.result }}';
            const pkg   = '${{ needs.package-quality.result }}';
            const cov   = '${{ needs.coverage.result }}';
            const inv   = '${{ needs.invariants.result }}';
            const description =
              state === 'success'
                ? `Haskell CI green (build-and-test=${build}, hlint=${lint}, pkg=${pkg}, cov=${cov}, inv=${inv})`
                : `Haskell CI red (build-and-test=${build}, hlint=${lint}, pkg=${pkg}, cov=${cov}, inv=${inv})`;
            const { owner, repo } = context.repo;
            const sha = context.sha;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha,
              state,
              context: 'ci/haskell-combined',
              description: description.slice(0, 140),
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
            });

  # -------------------------------------------------------------------------
  #  Release — fires only on `v*.*.*` tag push. Builds the sdist tarball
  #  (Hackage-compatible) + an installed binary per OS, attaches every
  #  artefact to the GitHub release for this tag.
  #
  #  Deliberate non-goals:
  #
  #  * Static binaries. Would require musl on Linux and a separate
  #    toolchain. Keep the dynamic-link builds for now; users who want
  #    static can build from source with --enable-executable-static.
  #  * Windows. The MCP hasn't been tested there. Linux + macOS cover
  #    every platform Claude Code officially supports today.
  # -------------------------------------------------------------------------
  release:
    name: Release — ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write     # needed to upload release assets
    defaults:
      run:
        working-directory: mcp-server-haskell
    steps:
      - uses: actions/checkout@v6

      - uses: haskell-actions/setup@v2
        with:
          ghc-version:    "9.12.2"
          cabal-version:  "3.12.1.0"
          cabal-update:   true

      - name: Build installable binary
        run: |
          cabal install exe:haskell-flows-mcp \
            --install-method=copy \
            --installdir=./_release \
            --overwrite-policy=always

      - name: Stage release assets
        run: |
          # Name artefacts with OS + arch so the release page is
          # self-documenting: haskell-flows-mcp-linux-x86_64,
          # haskell-flows-mcp-macos-aarch64, etc.
          mkdir -p _release_assets
          os_tag=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch_tag=$(uname -m)
          bin=_release/haskell-flows-mcp
          asset="haskell-flows-mcp-${os_tag}-${arch_tag}"
          cp "$bin" "_release_assets/$asset"
          # Also produce a .tar.gz for platforms that prefer one.
          tar -czf "_release_assets/${asset}.tar.gz" -C _release haskell-flows-mcp

      - name: Build sdist (Hackage-ready)
        # Only run on Linux — sdist is OS-independent, no point in
        # uploading two copies.
        if: matrix.os == 'ubuntu-latest'
        run: |
          cabal sdist --output-dir=_release_assets

      - name: Attach assets to the release
        uses: softprops/action-gh-release@v3
        with:
          files: mcp-server-haskell/_release_assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
